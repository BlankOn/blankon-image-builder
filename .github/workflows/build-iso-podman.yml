name: Build ISO (Podman experiment)

on:
  push:
    branches: [podman]
  pull_request:
    branches: [podman]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-podman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Podman rootless helpers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          for id_file in /etc/subuid /etc/subgid; do
            sudo python3 - "$USER" "$id_file" <<'PY'
          import pathlib
          import sys

          username, filename = sys.argv[1:]
          path = pathlib.Path(filename)
          records = []
          if path.exists():
              for line in path.read_text().splitlines():
                  fields = line.split(":")
                  if len(fields) == 3 and fields[1].isdigit() and fields[2].isdigit():
                      start, count = int(fields[1]), int(fields[2])
                      records.append((fields[0], start, start + count))
          conflicting_assignments = [
              (start, end, other_owner)
              for owner, start, end in records
              if owner == username
              for other_owner, other_start, other_end in records
              if other_owner != username and start < other_end and other_start < end
          ]
          if conflicting_assignments:
              start, end, other_owner = conflicting_assignments[0]
              raise SystemExit(
                  f"Conflicting {path.name} assignment for {username}: "
                  f"{start}:{end - start} overlaps {other_owner}; resolve it before provisioning."
              )
          if any(
              owner == username
              and end - start >= 65536
              and not any(
                  other_owner != username and start < other_end and start + 65536 > other_start
                  for other_owner, other_start, other_end in records
              )
              for owner, start, end in records
          ):
              raise SystemExit(0)
          start = 100000
          while any(start < end and start + 65536 > begin for _, begin, end in records):
              start += 65536
          with path.open("a") as destination:
              destination.write(f"{username}:{start}:65536\n")
          PY
          done
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true

      - name: Check static suites
        run: |
          set -euo pipefail
          for script in tools/podman-build-iso.sh build-iso purge-iso \
            tests/lib.sh tests/build-iso.sh tests/seccomp-profile.sh \
            tests/namespace-dispatch.sh tests/cache.sh tests/purge.sh \
            tests/podman-wrapper.sh tests/podman-build-lock.sh; do
            bash -n "$script"
          done
          python3 -m py_compile tools/generate_seccomp_profile.py tests/seccomp-profile.py
          bash tests/seccomp-profile.sh
          bash tests/build-iso.sh
          bash tests/cache.sh
          bash tests/purge.sh
          bash tests/podman-wrapper.sh
          bash tests/podman-build-lock.sh

      - name: Prepare E2E source and safe environment
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/blankon-ci-sources"
          output_root="$RUNNER_TEMP/blankon-ci-jahitan"
          mkdir -p "$source_root" "$output_root" workdir
          test ! -L workdir/.package-cache.lock
          if [[ ! -e workdir/.package-cache.lock ]]; then
            ( set -o noclobber; : > workdir/.package-cache.lock )
          fi
          test -f workdir/.package-cache.lock
          test ! -L workdir/.package-cache.lock
          cp -a tests/e2e/live-build "$source_root/blankon-live-build"
          printf 'TELEGRAM_BOT_KEY=%s\n' 'ci-unused-token' > .env
          {
            printf 'BUILD_SEND_TELEGRAM=0\n'
            printf 'BUILD_LOCAL=%s\n' "$source_root"
            printf 'BUILD_LOCKFILE=%s\n' "$source_root/.build.lock"
            printf 'BUILD_JAHITAN_PATH=%s\n' "$output_root"
            printf 'BUILD_PUBLISH_URL=%s\n' 'https://example.invalid/iso'
          } >> .env
          chmod 600 .env
          printf 'BUILD_LOCAL=%s\n' "$source_root" >> "$GITHUB_ENV"
          printf 'OUTPUT_ROOT=%s\n' "$output_root" >> "$GITHUB_ENV"

      - name: Build E2E ISO with rootless Podman
        run: bash tools/podman-build-iso.sh --local blankon-live-build

      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=("$OUTPUT_ROOT"/[0-9]*-[0-9]*/*.hybrid.iso)
          test "${#isos[@]}" -eq 1
          iso="${isos[0]}"
          test -s "$iso"
          test -s "$iso.sha256sum"
          test -s "$iso.zsync"
          (cd "$(dirname "$iso")" && sha256sum -c "$(basename "$iso.sha256sum")")
          expected_owner="$(id -u):$(id -g)"
          for path in "$OUTPUT_ROOT" "$(dirname "$iso")" "$iso" "$iso.sha256sum" "$iso.zsync"; do
            actual_owner=$(stat -c '%u:%g' "$path")
            test "$actual_owner" = "$expected_owner"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blankon-podman-e2e-iso
          path: ${{ runner.temp }}/blankon-ci-jahitan/**/*.hybrid.iso*
          if-no-files-found: error
          retention-days: 7
