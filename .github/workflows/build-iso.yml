name: Build ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userland-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: registry.fedoraproject.org/fedora@sha256:b0d8e732ad7e4fc32b6c77e040c40be98a8092f237271d264cc8d36fd9674372
          - distro: void-glibc
            image: ghcr.io/void-linux/void-glibc-full@sha256:0d8ab93458484cc3fa1e52d2efd4062c3dcca486c09c57068e99bc4b77e59ea0
          - distro: arch
            image: ghcr.io/archlinux/archlinux@sha256:d15a9b5548b8dd19bc8bf3e5a38265646c903d4d3b88c09c97b68227809fa925
    container: ${{ matrix.image }}
    steps:
      - name: Install fixture dependencies
        shell: sh
        env:
          TEST_DISTRO: ${{ matrix.distro }}
        run: |
          set -eu
          case "$TEST_DISTRO" in
            fedora)
              dnf install -y bash coreutils findutils util-linux git python3 curl tar ca-certificates
              ;;
            void-glibc)
              xbps-install -Sy bash coreutils findutils util-linux git python3 curl tar ca-certificates
              ;;
            arch)
              pacman -Syu --noconfirm --needed bash coreutils findutils util-linux git python curl tar ca-certificates
              ;;
            *)
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test Podman wrapper fixtures
        shell: bash
        run: bash tests/podman-wrapper.sh

      - name: Test namespace dispatch fixtures
        shell: bash
        run: bash tests/namespace-dispatch.sh

      - name: Test Podman build lock fixtures
        shell: bash
        run: bash tests/podman-build-lock.sh

      - name: Test mount cleanup fixtures
        shell: bash
        run: bash tests/mount-cleanup.sh

      - name: Test build ISO fixtures
        shell: bash
        run: bash tests/build-iso.sh

      - name: Test cache fixtures
        shell: bash
        run: bash tests/cache.sh

      - name: Test purge fixtures
        shell: bash
        run: bash tests/purge.sh

      - name: Test seccomp profile fixtures
        shell: bash
        run: bash tests/seccomp-profile.sh

      - name: Test live-build sysfs patch fixtures
        shell: bash
        run: python3 tests/patch-live-build-sysfs.py

      - name: Test seccomp profile Python fixtures
        shell: bash
        run: python3 tests/seccomp-profile.py

  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test Podman wrapper fixtures
        run: bash tests/podman-wrapper.sh

      - name: Test namespace dispatch fixtures
        run: bash tests/namespace-dispatch.sh

      - name: Test Podman build lock fixtures
        run: bash tests/podman-build-lock.sh

      - name: Test mount cleanup fixtures
        run: bash tests/mount-cleanup.sh

      - name: Test build ISO fixtures
        run: bash tests/build-iso.sh

      - name: Test cache fixtures
        run: bash tests/cache.sh

      - name: Test purge fixtures
        run: bash tests/purge.sh

      - name: Test seccomp profile fixtures
        run: bash tests/seccomp-profile.sh

      - name: Test live-build sysfs patch fixtures
        run: python3 tests/patch-live-build-sysfs.py

      - name: Test seccomp profile Python fixtures
        run: python3 tests/seccomp-profile.py

  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LIVE_BUILD_BRANCH: sinambung-dummy
      LIVE_BUILD_COMMIT: fb1e0c22e2c82c09d0c6b674319f4142ee708968
    strategy:
      fail-fast: false
      matrix:
        mode: [local, remote]
    name: Build ISO (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rootless Podman runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Prepare local live-build checkout
        if: ${{ matrix.mode == 'local' }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/blankon-ci-sources"
          mkdir -p "$source_root"
          git clone https://github.com/BlankOn/blankon-live-build.git "$source_root/blankon-live-build"
          git -C "$source_root/blankon-live-build" checkout --detach "$LIVE_BUILD_COMMIT"
          actual_commit="$(git -C "$source_root/blankon-live-build" rev-parse HEAD)"
          test "$actual_commit" = "$LIVE_BUILD_COMMIT"

      - name: Prepare safe build environment
        run: |
          set -euo pipefail
          umask 077
          mkdir -p workdir "$RUNNER_TEMP/blankon-ci-sources" "$RUNNER_TEMP/blankon-ci-jahitan"
          {
            printf 'BUILD_SEND_TELEGRAM=0\n'
            printf 'BUILD_LOCAL=%s\n' "$RUNNER_TEMP/blankon-ci-sources"
            printf 'BUILD_LOCKFILE=%s\n' "$RUNNER_TEMP/blankon-ci-sources/.build.lock"
            printf 'BUILD_JAHITAN_PATH=%s\n' "$RUNNER_TEMP/blankon-ci-jahitan"
            printf 'BUILD_PUBLISH_URL=%s\n' 'https://example.invalid/iso'
          } > .env

      - name: Build ISO
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == local ]]; then
            ./build-iso --local blankon-live-build
          elif [[ "$BUILD_MODE" == remote ]]; then
            ./build-iso --remote https://github.com/BlankOn/blankon-live-build.git "$LIVE_BUILD_BRANCH" "$LIVE_BUILD_COMMIT"
          else
            exit 1
          fi

      - name: Purge ISO package cache
        run: |
          set -euo pipefail
          ./purge-iso
          test ! -e workdir/package-cache
