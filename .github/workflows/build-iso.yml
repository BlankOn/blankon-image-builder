name: Build ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test Podman wrapper fixtures
        run: bash tests/podman-wrapper.sh

      - name: Test namespace dispatch fixtures
        run: bash tests/namespace-dispatch.sh

      - name: Test Podman build lock fixtures
        run: bash tests/podman-build-lock.sh

      - name: Test mount cleanup fixtures
        run: bash tests/mount-cleanup.sh

      - name: Test build ISO fixtures
        run: bash tests/build-iso.sh

      - name: Test cache fixtures
        run: bash tests/cache.sh

      - name: Test purge fixtures
        run: bash tests/purge.sh

      - name: Test seccomp profile fixtures
        run: bash tests/seccomp-profile.sh

      - name: Test live-build sysfs patch fixtures
        run: python3 tests/patch-live-build-sysfs.py

      - name: Test seccomp profile Python fixtures
        run: python3 tests/seccomp-profile.py

  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [local, remote]
    name: Build ISO (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rootless Podman runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Prepare local live-build checkout
        if: ${{ matrix.mode == 'local' }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/blankon-ci-sources"
          mkdir -p "$source_root"
          git clone --depth 1 --branch sinambung-dummy https://github.com/BlankOn/blankon-live-build.git "$source_root/blankon-live-build"

      - name: Prepare safe build environment
        run: |
          set -euo pipefail
          umask 077
          mkdir -p workdir "$RUNNER_TEMP/blankon-ci-sources" "$RUNNER_TEMP/blankon-ci-jahitan"
          {
            printf 'BUILD_SEND_TELEGRAM=0\n'
            printf 'BUILD_LOCAL=%s\n' "$RUNNER_TEMP/blankon-ci-sources"
            printf 'BUILD_LOCKFILE=%s\n' "$RUNNER_TEMP/blankon-ci-sources/.build.lock"
            printf 'BUILD_JAHITAN_PATH=%s\n' "$RUNNER_TEMP/blankon-ci-jahitan"
            printf 'BUILD_PUBLISH_URL=%s\n' 'https://example.invalid/iso'
          } > .env

      - name: Build ISO
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == local ]]; then
            ./build-iso --local blankon-live-build
          elif [[ "$BUILD_MODE" == remote ]]; then
            ./build-iso --remote https://github.com/BlankOn/blankon-live-build.git sinambung-dummy
          else
            exit 1
          fi

      - name: Purge ISO package cache
        run: |
          set -euo pipefail
          ./purge-iso
          test ! -e workdir/package-cache
