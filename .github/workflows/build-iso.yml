name: Build ISO

on:
  push:
    branches: [sinambung]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck -S warning -x build-iso purge-iso libexec/blankon-image-builder/build-iso-runtime tests/*.sh

      - name: Fixture tests
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            [[ "$test_script" == tests/lib.sh ]] && continue
            echo "::group::$test_script"
            bash "$test_script"
            echo '::endgroup::'
          done
          python3 tests/podman-security.py

  build-iso:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/sinambung'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LIVE_BUILD_REPO: https://github.com/BlankOn/blankon-live-build.git
      LIVE_BUILD_BRANCH: sinambung-dummy
      LIVE_BUILD_COMMIT: fb1e0c22e2c82c09d0c6b674319f4142ee708968
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rootless Podman runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Prepare build environment
        run: |
          set -euo pipefail
          umask 077
          ci_root="$RUNNER_TEMP/blankon-ci"
          mkdir -p workdir "$ci_root/sources" "$ci_root/jahitan"
          {
            printf 'BUILD_LOCAL=%s\n' "$ci_root/sources"
            printf 'BUILD_LOCKFILE=%s\n' "$ci_root/sources/.build.lock"
            printf 'BUILD_JAHITAN_PATH=%s\n' "$ci_root/jahitan"
            printf 'BUILD_PUBLISH_URL=%s\n' 'https://example.invalid/iso'
          } > .env

      - name: Build ISO
        run: ./build-iso --remote "$LIVE_BUILD_REPO" "$LIVE_BUILD_BRANCH" "$LIVE_BUILD_COMMIT"

      - name: Purge ISO package cache
        run: |
          ./purge-iso
          test ! -e workdir/package-cache
