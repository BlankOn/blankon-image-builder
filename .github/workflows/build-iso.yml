name: Build ISO

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: ISO source profile
        type: choice
        required: true
        default: e2e
        options:
          - e2e
          - gnome

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [local, remote]
    name: Build ISO (${{ matrix.mode }}, ${{ inputs.profile || 'e2e' }})
    env:
      ISO_PROFILE: ${{ inputs.profile || 'e2e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: |
          set -euo pipefail
          for script in build-iso tests/lib.sh tests/build-iso.sh; do
            bash -n "$script"
          done
          test -x build-iso

      - name: Exercise failure and publication paths
        run: bash tests/build-iso.sh

      - name: Free disk space for the GNOME image
        if: ${{ inputs.profile == 'gnome' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          docker image prune --all --force
          df -h /

      - name: Prepare live-build source
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/blankon-ci-sources"
          mkdir -p "$source_root"
          if [[ "$ISO_PROFILE" == gnome ]]; then
            git clone --depth 1 --branch variant-gnome \
              https://github.com/BlankOn/blankon-live-build.git \
              "$source_root/blankon-live-build"
            source_repo=https://github.com/BlankOn/blankon-live-build.git
            source_branch=variant-gnome
            expected_variant=gnome
          else
            cp -a tests/e2e/live-build "$source_root/blankon-live-build"
            git -C "$source_root/blankon-live-build" init -b ci
            git -C "$source_root/blankon-live-build" add --all
            git -C "$source_root/blankon-live-build" \
              -c user.name='BlankOn CI' -c user.email='ci@blankonlinux.id' \
              commit -qm 'Minimal live-build E2E source'
            git clone --bare "$source_root/blankon-live-build" "$source_root/remote.git"
            sudo chown -R root:root "$source_root/remote.git"
            source_repo="file://$source_root/remote.git"
            source_branch=ci
            expected_variant=ci
          fi
          test "$(cat "$source_root/blankon-live-build/variant")" = "$expected_variant"
          test -d "$source_root/blankon-live-build/config/common"
          test -d "$source_root/blankon-live-build/config/$expected_variant"
          test -d "$source_root/blankon-live-build/auto"
          printf 'LIVE_BUILD_REPO=%s\n' "$source_repo" >> "$GITHUB_ENV"
          printf 'LIVE_BUILD_BRANCH=%s\n' "$source_branch" >> "$GITHUB_ENV"
          printf 'LIVE_BUILD_SHA=%s\n' \
            "$(git -C "$source_root/blankon-live-build" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare CI builder image and Compose environment
        run: |
          set -euo pipefail
          test "$(head -n 1 Dockerfile)" = 'FROM ghcr.io/blankon/blankon-nightly:latest'
          {
            head -n 1 Dockerfile
            cat <<'DOCKERFILE'
          RUN printf '%s\n' 'deb http://arsip-dev.blankonlinux.id/sinambung sinambung main restricted extras restricted-firmware' > /etc/apt/sources.list \
              && rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          DOCKERFILE
            tail -n +2 Dockerfile
          } > .github/Dockerfile.ci
          cat > .github/compose.ci.yml <<'COMPOSE'
          services:
            builder:
              build:
                context: .
                dockerfile: .github/Dockerfile.ci
          COMPOSE
          umask 077
          mkdir -p workdir "$RUNNER_TEMP/blankon-ci-jahitan"
          {
            printf 'TELEGRAM_BOT_KEY=%s\n' 'ci-unused-token'
            printf 'BUILD_SEND_TELEGRAM=0\n'
            printf 'BUILD_LOCAL=%s\n' "$RUNNER_TEMP/blankon-ci-sources"
            printf 'BUILD_LOCKFILE=%s\n' "$RUNNER_TEMP/blankon-ci-sources/.build.lock"
            printf 'BUILD_JAHITAN_PATH=%s\n' "$RUNNER_TEMP/blankon-ci-jahitan"
            printf 'BUILD_PUBLISH_URL=%s\n' 'https://example.invalid/iso'
          } > .env
          printf 'HOST_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'HOST_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"
          printf 'COMPOSE_FILE=%s:%s\n' \
            "$GITHUB_WORKSPACE/compose.yml" "$GITHUB_WORKSPACE/.github/compose.ci.yml" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose --project-directory "$GITHUB_WORKSPACE" --env-file .env config --quiet

      - name: Build CI builder image
        run: docker compose --project-directory "$GITHUB_WORKSPACE" --env-file .env build

      - name: Check builder tools
        run: |
          docker compose --project-directory "$GITHUB_WORKSPACE" --env-file .env run --rm --no-deps builder \
            sh -ec 'for tool in lb debootstrap zsyncmake flock findmnt; do command -v "$tool"; done'

      - name: Build real ${{ matrix.mode }} ${{ inputs.profile || 'e2e' }} ISO
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/build-iso-attempt-$attempt.log"
            if [[ '${{ matrix.mode }}' == local ]]; then
              if ./build-iso --local blankon-live-build 2>&1 | tee "$log"; then
                break
              fi
            else
              if ./build-iso --remote "$LIVE_BUILD_REPO" "$LIVE_BUILD_BRANCH" "$LIVE_BUILD_SHA" 2>&1 | tee "$log"; then
                break
              fi
            fi
            tail -n 220 "$log" > "$RUNNER_TEMP/build-iso-error-tail.log"
            if (( attempt == 3 )) || ! grep -Eqi \
              'Could not connect to|connection timed out|Temporary failure resolving|Network is unreachable' \
              "$RUNNER_TEMP/build-iso-error-tail.log"; then
              exit 1
            fi
            echo "::warning::Archive connection failed; retrying ISO build ($attempt/3)"
            sleep "$((attempt * 30))"
          done

      - name: Verify published ISO
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=("$RUNNER_TEMP"/blankon-ci-jahitan/[0-9]*-[0-9]*/*.hybrid.iso)
          test "${#isos[@]}" -eq 1
          iso="${isos[0]}"
          test -s "$iso"
          test -s "$iso.zsync"
          test -s "$iso.sha256sum"
          (cd "$(dirname "$iso")" && sha256sum -c "$(basename "$iso.sha256sum")")
          current="$RUNNER_TEMP/blankon-ci-jahitan/current"
          test -s "$current/$(basename "$iso")"
          test -s "$current/current.txt"
          df -h /

      - name: Verify real package cache restore
        if: ${{ inputs.profile != 'gnome' }}
        run: |
          set -euo pipefail
          source ./build-iso
          WORKSPACE_DIR="$GITHUB_WORKSPACE/workdir"
          ARCH=amd64
          cache_key=$(package_cache_key)
          cache_dir="$WORKSPACE_DIR/package-cache/$cache_key"
          test -d "$cache_dir"
          saved_count=$(find "$cache_dir" -type f -name '*.deb' | wc -l)
          test "$saved_count" -gt 0

          restore_root=$(mktemp -d "$RUNNER_TEMP/cache-restore.XXXXXXXX")
          mv -- "$WORKSPACE_DIR/package-cache" "$restore_root/package-cache"
          WORKSPACE_DIR="$restore_root"
          restore_package_cache "$cache_key"

          (cd "$restore_root/package-cache/$cache_key" && \
            find . -type f -name '*.deb' -print0 | sort -z | xargs -0 -r sha256sum) \
            > "$restore_root/saved.sha256"
          (cd "$restore_root/.build/cache" && \
            find . -type f -name '*.deb' -print0 | sort -z | xargs -0 -r sha256sum) \
            > "$restore_root/restored.sha256"
          cmp "$restore_root/saved.sha256" "$restore_root/restored.sha256"
          echo "Restored $saved_count real package files from the build cache."
