services:
  builder:
    build: .
    working_dir: /workdir
    user: "${BUILDER_UID:?BUILDER_UID is required}:${BUILDER_GID:?BUILDER_GID is required}"
    security_opt:
      - seccomp=./workdir/seccomp-livebuild.json
      - systempaths=unconfined
    env_file: .env
    environment:
      BUILDER_CONTAINER: "1"
      HOST_UID: ${HOST_UID:?HOST_UID is required}
      HOST_GID: ${HOST_GID:?HOST_GID is required}
    volumes:
      - ./workdir:/workdir
      - .:/builder:ro
      - ${BUILD_LOCAL}:${BUILD_LOCAL}
      - ${BUILD_JAHITAN_PATH}:${BUILD_JAHITAN_PATH}
  seccomp-profile-generator:
    build: .
    working_dir: /workdir
    user: "${BUILDER_UID:?BUILDER_UID is required}:${BUILDER_GID:?BUILDER_GID is required}"
    volumes:
      - ./workdir:/workdir
    entrypoint: ["python3", "/usr/local/bin/generate-seccomp-profile.py"]
